<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Trip Dashboard</title>
<!-- Leaflet — primary CDN (jsDelivr is faster/more reliable on mobile than unpkg) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  /* safe-area insets for iPhone notch / Dynamic Island / home bar */
  nav { padding-left: max(8px, env(safe-area-inset-left)); padding-right: max(8px, env(safe-area-inset-right)); }
  footer { padding-bottom: max(24px, env(safe-area-inset-bottom)); }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    background: rgba(15,23,42,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0; overflow-x: auto;
    padding: 0 8px; height: 48px;
    -webkit-overflow-scrolling: touch;   /* smooth momentum scroll on iOS */
    overscroll-behavior-x: contain;      /* prevent page bounce while swiping nav */
    scrollbar-width: none;               /* hide scrollbar on Firefox */
  }
  nav::-webkit-scrollbar { display: none; } /* hide scrollbar on WebKit */
  nav a {
    color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600;
    padding: 8px 10px; border-radius: 6px; white-space: nowrap;
    transition: color .2s, background .2s; flex-shrink: 0;
    -webkit-tap-highlight-color: transparent; /* remove blue flash on iOS tap */
    min-height: 44px; display: flex; align-items: center; /* 44px Apple tap target minimum */
  }
  nav a:hover, nav a.active { color: #fff; background: rgba(255,255,255,0.1); }

  /* ── LAYOUT ── */
  .page { padding-top: 48px; display: flex; flex-direction: column; min-height: 100vh; }

  /* ── MAP SECTION ── */
  #map-section {
    position: relative; width: 100%;
    height: calc(100vh - 48px);          /* fallback for older browsers */
    height: calc(100dvh - 48px);         /* iOS Safari dynamic viewport — excludes browser chrome */
    min-height: 400px;
  }
  #map { width: 100%; height: 100%; }

  /* map legend */
  .map-legend {
    position: absolute; bottom: 72px; left: 12px; z-index: 900;
    background: rgba(15,23,42,0.88); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 11px; line-height: 1.8;
    max-width: calc(50vw - 20px); /* keep it from touching the scroll hint on phones */
  }
  .map-legend h4 { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .leg-row { display: flex; align-items: center; gap: 6px; }
  .leg-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leg-star { font-size: 12px; }

  /* scroll hint */
  .scroll-hint {
    position: absolute; bottom: 24px; left: 12px; right: 12px; z-index: 900; /* full-width on mobile */
    background: rgba(15,23,42,0.88); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    animation: bounce 2s infinite;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(4px)} }

  /* on wider screens restore the old side-by-side layout */
  @media (min-width: 480px) {
    .map-legend { bottom: 24px; max-width: none; }
    .scroll-hint { left: auto; width: auto; right: 12px; justify-content: flex-start; }
  }

  /* ── ITINERARY SECTION ── */
  #itinerary { padding: 32px 16px 64px; max-width: 760px; margin: 0 auto; }

  .region-header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 24px 0 12px; border-bottom: 2px solid; margin-bottom: 16px;
  }
  .region-header h2 { font-size: 20px; font-weight: 700; }
  .region-header .dates { font-size: 13px; color: var(--muted); margin-left: auto; }
  .region-header .wx-chip { font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* Day card */
  .day-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 10px; overflow: hidden;
  }
  .day-card-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; cursor: pointer; user-select: none;
    -webkit-tap-highlight-color: transparent;
    min-height: 52px; /* comfortable tap target on phones */
  }
  .day-card-header:hover { background: rgba(255,255,255,0.04); }
  .day-num {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); min-width: 36px;
  }
  .day-title { font-size: 15px; font-weight: 600; flex: 1; }
  .day-badge {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px;
    text-transform: uppercase; letter-spacing: .05em;
  }
  .badge-drive { background: rgba(99,102,241,0.2); color: #a5b4fc; }
  .badge-explore { background: rgba(16,185,129,0.2); color: #6ee7b7; }
  .badge-hike { background: rgba(245,158,11,0.2); color: #fcd34d; }
  .badge-flex { background: rgba(100,116,139,0.2); color: #cbd5e1; }
  .chevron { transition: transform .25s; color: var(--muted); font-size: 14px; }
  .day-card.open .chevron { transform: rotate(180deg); }

  .day-card-body {
    max-height: 0; overflow: hidden;
    transition: max-height .35s ease;
    padding: 0 16px;
  }
  .day-card.open .day-card-body { max-height: 1800px; }
  .day-card-body-inner { padding: 0 0 16px; border-top: 1px solid var(--border); }

  .activity { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(71,85,105,0.4); }
  .activity:last-child { border-bottom: none; }
  .activity-icon { font-size: 18px; line-height: 1.2; width: 24px; text-align: center; flex-shrink: 0; }
  .activity-text { font-size: 13px; line-height: 1.5; color: var(--text); }
  .activity-text strong { color: #e2e8f0; }
  .activity-text .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .optional-tag { font-size: 10px; color: #fbbf24; background: rgba(251,191,36,0.15); padding: 1px 5px; border-radius: 4px; margin-left: 4px; }

  /* drive bar */
  .drive-bar {
    margin: 8px 0; padding: 8px 12px; border-radius: 8px;
    background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.25);
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: #a5b4fc;
  }

  /* hike tabs */
  .hike-tabs { margin: 12px 0 0; }
  .hike-tab-btns { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .htab {
    padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; transition: .2s;
    -webkit-tap-highlight-color: transparent;
    min-height: 44px; /* Apple tap target */
  }
  .htab.active { background: var(--card2); color: var(--text); border-color: var(--muted); }
  .hike-option { display: none; font-size: 13px; padding: 10px; background: var(--card2); border-radius: 8px; }
  .hike-option.active { display: block; }
  .hike-option p { margin-bottom: 6px; }
  .hike-option .trail-stat { display: inline-block; background: rgba(0,0,0,0.3); border-radius: 4px; padding: 2px 7px; font-size: 11px; margin: 2px 2px 0 0; color: var(--muted); }

  /* AllTrails link button */
  .trail-link {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 10px; padding: 6px 12px; border-radius: 6px;
    background: rgba(5,150,105,0.15); border: 1px solid rgba(5,150,105,0.35);
    color: #6ee7b7; font-size: 11px; font-weight: 700; text-decoration: none;
    letter-spacing: .03em; transition: background .2s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .trail-link:hover { background: rgba(5,150,105,0.25); border-color: rgba(5,150,105,0.55); }
  .trail-link svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

  /* ── REGION INFO CARDS (eat / more-to-do tabs) ── */
  .region-info-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 14px; overflow: hidden;
  }
  .ri-tabs { display: flex; border-bottom: 1px solid var(--border); }
  .ri-tab {
    flex: 1; padding: 10px 8px; font-size: 13px; font-weight: 600; text-align: center;
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .2s, border-color .2s; -webkit-tap-highlight-color: transparent; min-height: 44px;
  }
  .ri-tab.active { color: var(--text); border-bottom-color: #e2e8f0; }
  .ri-panel { display: none; padding: 10px 16px 14px; }
  .ri-panel.active { display: block; }
  .ri-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(71,85,105,0.28); }
  .ri-item:last-child { border-bottom: none; }
  .ri-icon { font-size: 16px; width: 22px; flex-shrink: 0; text-align: center; margin-top: 1px; }
  .ri-text { font-size: 13px; line-height: 1.45; }
  .ri-text strong { color: #e2e8f0; }
  .ri-sub { color: var(--muted); font-size: 11px; margin-top: 2px; line-height: 1.4; }
  .ri-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 99px; margin-left: 4px; vertical-align: middle; }
  .rb-casual { background: rgba(16,185,129,0.15);  color: #6ee7b7; }
  .rb-fine   { background: rgba(99,102,241,0.15);  color: #a5b4fc; }
  .rb-brew   { background: rgba(245,158,11,0.15);  color: #fcd34d; }
  .rb-wine   { background: rgba(220,38,38,0.15);   color: #fca5a5; }
  .rb-must   { background: rgba(6,182,212,0.15);   color: #67e8f9; }
  /* "Hours / menu / info" link on a region-info item */
  .ri-link {
    display: inline-flex; align-items: center; gap: 4px;
    margin-top: 6px; padding: 4px 9px; border-radius: 5px;
    background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.3);
    color: #cbd5e1; font-size: 10px; font-weight: 700; text-decoration: none;
    letter-spacing: .02em; transition: background .2s, border-color .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .ri-link:hover { background: rgba(148,163,184,0.22); border-color: rgba(148,163,184,0.5); }

  /* ── RESOURCES (trip operations center) ── */
  #logistics { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
  .res-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .res-section-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; border-bottom: 1px solid var(--border); }
  .res-section-header h3 { font-size: 14px; font-weight: 700; flex: 1; }
  .res-intro { font-size: 12px; color: var(--muted); padding: 10px 16px 8px; line-height: 1.5; border-bottom: 1px solid rgba(71,85,105,0.3); }
  .res-item { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 9px 16px; border-bottom: 1px solid rgba(71,85,105,0.22); }
  .res-item:last-child { border-bottom: none; }
  .res-item-left { display: flex; align-items: flex-start; gap: 8px; flex: 1; min-width: 0; }
  .res-item-label { font-size: 13px; line-height: 1.4; }
  .res-item-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .res-item-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  /* Priority dot */
  .pri-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .pri-critical    { background: #ef4444; }
  .pri-recommended { background: #f59e0b; }
  .pri-optional    { background: #475569; }
  /* One-tap done checkbox */
  .task-check {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    border: 2px solid var(--border); background: transparent; color: transparent;
    font-size: 16px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s; -webkit-tap-highlight-color: transparent;
  }
  .task-check.done { background: #059669; border-color: #059669; color: #fff; }
  .task-label-done .res-item-label { text-decoration: line-through; color: var(--muted); }
  /* Progress bar */
  .res-progress { margin: 4px 0 12px; }
  .res-progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .res-progress-bar  { height: 8px; border-radius: 99px; background: rgba(148,163,184,0.15); overflow: hidden; }
  .res-progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #059669, #10b981); transition: width .3s; }
  /* To do / Done / All filter pills */
  .res-filters { display: flex; gap: 8px; margin-bottom: 14px; }
  .res-filter {
    font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 99px;
    border: 1px solid var(--border); background: transparent; color: var(--muted);
    cursor: pointer; min-height: 34px; -webkit-tap-highlight-color: transparent;
    transition: background .15s, color .15s;
  }
  .res-filter.active { background: var(--card2); color: var(--text); border-color: var(--muted); }
  .res-count { font-size: 11px; color: var(--muted); font-weight: 600; }
  .res-empty { text-align: center; color: var(--muted); padding: 28px 16px; font-size: 13px; }
  /* Compact quick-links row (foliage etc.) */
  .quick-links { font-size: 12px; color: var(--muted); margin: 0 0 12px; line-height: 1.8; }
  .quick-links a { color: #fcd34d; }
  /* Action buttons */
  .res-btn { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 6px; text-decoration: none; white-space: nowrap; transition: background .15s; -webkit-tap-highlight-color: transparent; display: inline-flex; align-items: center; gap: 3px; border: 1px solid; min-height: 26px; }
  .res-btn-booking { background: rgba(5,150,105,0.15);  border-color: rgba(5,150,105,0.4);  color: #6ee7b7; }
  .res-btn-booking:hover { background: rgba(5,150,105,0.28); }
  .res-btn-info    { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.4); color: #a5b4fc; }
  .res-btn-info:hover { background: rgba(99,102,241,0.28); }
  .res-btn-guide   { background: rgba(100,116,139,0.15); border-color: rgba(100,116,139,0.4); color: #94a3b8; }
  .res-btn-guide:hover { background: rgba(100,116,139,0.28); }
  /* Booking reference — confirmation text + link, saved per task */
  .res-ref-btn {
    font-size: 11px; padding: 3px 7px; border-radius: 6px; cursor: pointer;
    background: rgba(148,163,184,0.12); border: 1px solid rgba(148,163,184,0.3);
    color: #cbd5e1; min-height: 26px; -webkit-tap-highlight-color: transparent;
  }
  .res-ref-btn.has-ref { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.45); }
  .res-ref { font-size: 11px; color: #6ee7b7; margin-top: 4px; word-break: break-word; }
  .res-ref a { color: #67e8f9; }
  .res-ref-editor {
    flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-top: 4px; padding-top: 8px; border-top: 1px dashed rgba(71,85,105,0.5);
  }
  /* the class sets display:flex, so [hidden] needs an explicit override */
  .res-ref-editor[hidden] { display: none; }
  .res-ref-input {
    flex: 1; min-width: 150px; font-size: 12px; padding: 6px 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .res-ref-input:focus { outline: none; border-color: var(--muted); }
  .res-ref-actions { display: flex; gap: 6px; }
  .res-ref-save, .res-ref-clear {
    font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid; -webkit-tap-highlight-color: transparent; min-height: 30px;
  }
  .res-ref-save  { background: rgba(5,150,105,0.2);   border-color: rgba(5,150,105,0.45);   color: #6ee7b7; }
  .res-ref-clear { background: rgba(100,116,139,0.15); border-color: rgba(100,116,139,0.4); color: #94a3b8; }
  /* Export-tasks button in the ops-center header */
  .res-export {
    margin-left: auto; font-size: 11px; font-weight: 700; padding: 6px 12px;
    border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent;
    background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.4);
    color: #a5b4fc; min-height: 32px;
  }
  .res-export:hover { background: rgba(99,102,241,0.28); }

  /* ── CALENDAR ── */
  #calendar { max-width: 760px; margin: 0 auto; padding: 8px 16px 0; scroll-margin-top: 56px; }
  .cal-legend { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .cal-month {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .cal-month-name { font-size: 14px; font-weight: 700; color: #e2e8f0; margin-bottom: 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-dow {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); text-align: center; padding-bottom: 2px;
  }
  .cal-cell {
    aspect-ratio: 1; border-radius: 8px; padding: 4px 5px;
    display: flex; flex-direction: column; border: 2px solid transparent;
  }
  .cal-empty { border: none; }
  .cal-num { font-size: 12px; font-weight: 600; color: var(--muted); }
  .cal-inrange { background: rgba(148,163,184,0.07); }
  .cal-trip {
    background: var(--card2); cursor: pointer;
    -webkit-tap-highlight-color: transparent; transition: filter .15s;
  }
  .cal-trip:hover { filter: brightness(1.3); }
  .cal-trip .cal-num { color: #f1f5f9; font-weight: 700; }
  .cal-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: auto; align-self: flex-end; }
  /* Top row of a calendar cell: day number + advance-booking ticket mark */
  .cal-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 2px; }
  .cal-tix { font-size: 10px; line-height: 1.1; }
  /* Advance-booking summary printed under the month grids */
  .cal-book {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .cal-book h3 { font-size: 14px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
  .cal-book-intro { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .cal-book-row {
    display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .cal-book-row:hover { background: rgba(148,163,184,0.06); }
  .cal-book-date { flex: 0 0 68px; font-size: 12px; font-weight: 700; }
  .cal-book-items { font-size: 12px; color: var(--muted); }
  .cal-book-items div { margin-bottom: 3px; }
  .cal-book-items div:last-child { margin-bottom: 0; }
  .cal-book-must { color: #fca5a5; font-weight: 700; }

  /* ── FOOTER ── */
  footer { text-align: center; padding: 24px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }

  /* ── TRIP PICKER (landing page when several trips exist) ── */
  #trip-picker { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
  #trip-picker h1 { font-size: 22px; margin-bottom: 6px; }
  #trip-picker .picker-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  .trip-card {
    display: block; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
    text-decoration: none; color: var(--text); transition: border-color .2s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .trip-card:hover { background: var(--card2); border-color: var(--muted); }
  .trip-card .trip-title { font-size: 16px; font-weight: 700; }
  .trip-card .trip-dates { font-size: 12px; color: var(--muted); margin-top: 4px; }

  /* ── CUSTOM MAP MARKERS ── */
  .marker-main {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800;
    border: 3px solid rgba(255,255,255,0.9);
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .marker-poi {
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 2px 6px rgba(0,0,0,0.45);
    background: #334155; color: #e2e8f0;
  }
  .marker-poi.activity { background: #475569; }
  .marker-poi.hike     { background: #4d7c0f; }
  .marker-poi.scenic   { background: #047857; }
  .marker-poi.food     { background: #b45309; }
  /* popup "Open in Google Maps" button */
  .popup-gmaps {
    display: inline-block; margin-top: 8px; padding: 5px 10px; border-radius: 6px;
    background: #1d4ed8; color: #fff !important; font-size: 12px; font-weight: 600;
    text-decoration: none;
  }
  .popup-site { display: inline-block; margin-top: 8px; margin-left: 6px; font-size: 12px; font-weight: 600; color: #1d4ed8; text-decoration: none; }

  /* ── ACTION BUTTONS (Google Maps links etc.) ── */
  .nav-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
    text-decoration: none; border: 1px solid var(--border); background: var(--card2); color: var(--text);
    -webkit-tap-highlight-color: transparent; min-height: 36px; cursor: pointer;
    transition: background .2s, border-color .2s; white-space: nowrap;
  }
  .nav-btn:hover { background: #3f4d63; }
  .nav-btn.maps { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: #86efac; }
  .nav-btn.maps:hover { background: rgba(16,185,129,0.28); }
  /* drive bar with a Navigate button */
  .drive-bar { flex-wrap: wrap; }
  .drive-bar .drive-text { flex: 1; min-width: 60%; }
  .drive-bar .nav-btn { margin-left: auto; }
</style>
<!-- Trip manifest: the list of available trips. The trip data file
     itself is loaded dynamically based on the ?trip= URL param. -->
<script src="trips/manifest.js"></script>
</head>
<body>

<!-- NAV (links generated from the trip's regions) -->
<nav></nav>

<!-- Landing page shown when several trips exist and none is selected -->
<section id="trip-picker" hidden></section>

<div class="page">

<!-- ═══════════════ MAP ═══════════════ -->
<section id="map-section">
  <div id="map"></div>
  <div class="map-legend"></div>
  <div class="scroll-hint" onclick="document.getElementById('itinerary').scrollIntoView({behavior:'smooth'})">
    📅 See day-by-day ↓
  </div>
</section>

<!-- ═══════════════ CALENDAR ═══════════════ -->
<section id="calendar"></section>

<!-- ═══════════════ ITINERARY ═══════════════ -->
<section id="itinerary"></section>

<!-- ═══════════════ LOGISTICS / CHECKLIST ═══════════════ -->
<section id="logistics"></section>

<footer></footer>

</div><!-- .page -->

<script>
// ══════════════════════════════════════
// RENDERING  (reads window.TRIP_DATA, loaded per-trip by the
// bootstrap at the bottom of this file)
// ══════════════════════════════════════

// Filled in by initDashboard() once the trip data file has loaded.
let META, TRIP, ROUTE, ROUTES_ALT, STOPS, POIS, REGIONS, DAYS, QUICK_LINKS, RESOURCES;

const AT_SVG = `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;

// ── DATES ──────────────────────────────────────────────────
// Days in the trip data carry ISO yyyy-mm-dd dates. These helpers
// turn them into display strings without any timezone surprises
// (Date is built from explicit y/m/d parts, so it stays local).
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parseISO(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatDate(iso)     { const d = parseISO(iso); return MONTH_ABBR[d.getMonth()] + ' ' + d.getDate(); }
function formatDateFull(iso) { const d = parseISO(iso); return WEEKDAY_ABBR[d.getDay()] + ' ' + MONTH_ABBR[d.getMonth()] + ' ' + d.getDate(); }

function renderActivity(a) {
  const tagHtml    = a.tag      ? ` <span class="optional-tag">${a.tag}</span>` : '';
  const trailHtml  = a.trailUrl ? `<br><a class="trail-link" href="${a.trailUrl}" target="_blank" rel="noopener" style="margin-top:8px">${AT_SVG} View on AllTrails</a>` : '';
  const infoHtml   = a.url      ? `<br><a class="ri-link" href="${a.url}" target="_blank" rel="noopener" style="margin-top:8px">${a.urlLabel || '🔗 Hours &amp; info'} ↗</a>` : '';
  const styleAttr  = a.style    ? ` style="${a.style}"` : '';
  return `<div class="activity"${styleAttr}>
    <div class="activity-icon">${a.icon}</div>
    <div class="activity-text">
      <strong>${a.title}</strong>${tagHtml}
      <div class="sub">${a.sub}${trailHtml}${infoHtml}</div>
    </div>
  </div>`;
}

// Build a Google Maps turn-by-turn directions URL from a { from, to, via? } route.
function gmapsDirUrl(route) {
  const p = new URLSearchParams({ api: '1', origin: route.from, destination: route.to, travelmode: 'driving' });
  if (route.via && route.via.length) p.set('waypoints', route.via.join('|'));
  return 'https://www.google.com/maps/dir/?' + p.toString();
}

function renderDriveBar(d) {
  const navBtn = d.route
    ? `<a class="nav-btn maps" href="${gmapsDirUrl(d.route)}" target="_blank" rel="noopener">🧭 Navigate</a>`
    : '';
  return `<div class="drive-bar">🚗 <span class="drive-text">${d.text}</span>${navBtn}</div>`;
}

function renderHikePanel(prefix, tab) {
  const stats     = tab.stats.map(s => `<span class="trail-stat">${s}</span>`).join('');
  const separator = tab.note
    ? `<p style="margin-top:8px; font-size:12px; color:var(--muted)">${tab.note}</p>`
    : '<br>';
  const titlePara = tab.desc
    ? `<p><strong>${tab.title}</strong>${tab.desc}</p>`
    : `<p><strong>${tab.title}</strong></p>`;
  // linkLabel lets a tab point at something that is not an AllTrails page
  // (an attraction's hours/tickets page, say) without lying about the link.
  const linkHtml = tab.url
    ? `<a class="trail-link" href="${tab.url}" target="_blank" rel="noopener">
      ${AT_SVG}
      ${tab.linkLabel || 'View on AllTrails'}
    </a>`
    : '';
  return `<div id="${prefix}-${tab.id}" class="hike-option${tab.active ? ' active' : ''}">
    ${titlePara}
    ${stats}
    ${separator}
    ${linkHtml}
  </div>`;
}

function renderHikeTabs(ht) {
  const btns   = ht.tabs.map(t =>
    `<button class="htab${t.active ? ' active' : ''}" onclick="hikeTab('${ht.prefix}','${t.id}')">${t.label}</button>`
  ).join('');
  const panels = ht.tabs.map(t => renderHikePanel(ht.prefix, t)).join('');
  return `<div class="hike-tabs">
    <div class="hike-tab-btns">${btns}</div>
    ${panels}
  </div>`;
}

function renderDay(id, day) {
  const content = day.content.map(item => {
    if (item.type === 'activity')  return renderActivity(item);
    if (item.type === 'drive')     return renderDriveBar(item);
    if (item.type === 'hiketabs')  return renderHikeTabs(item);
    return '';
  }).join('');
  return `<div class="day-card" id="${id}">
    <div class="day-card-header" onclick="toggle('${id}')">
      <span class="day-num">${formatDate(day.date)}</span>
      <span class="day-title">${day.title}</span>
      <span class="day-badge badge-${day.badge}">${day.badgeLabel}</span>
      <span class="chevron">▼</span>
    </div>
    <div class="day-card-body"><div class="day-card-body-inner">
      ${content}
    </div></div>
  </div>`;
}

function renderRiItem(item, kind) {
  const badgeHtml = item.badge
    ? ` <span class="ri-badge ${item.badge}">${item.badgeLabel}</span>`
    : '';
  const linkLabel = item.linkLabel || (kind === 'eat' ? '🍽 Menu &amp; hours' : '🔗 Hours &amp; info');
  const linkHtml = item.url
    ? `<br><a class="ri-link" href="${item.url}" target="_blank" rel="noopener">${linkLabel} ↗</a>`
    : '';
  return `<div class="ri-item">
    <div class="ri-icon">${item.icon}</div>
    <div class="ri-text">
      <strong>${item.name}</strong>${badgeHtml}
      <div class="ri-sub">${item.sub}${linkHtml}</div>
    </div>
  </div>`;
}

function renderInfoCard(card) {
  const eatItems    = card.eat.map(i => renderRiItem(i, 'eat')).join('');
  const nohikeItems = card.nohike.map(i => renderRiItem(i, 'nohike')).join('');
  return `<div class="region-info-card">
    <div class="ri-tabs">
      <button class="ri-tab active" onclick="riTab('${card.prefix}','eat')">🍽 Where to Eat</button>
      <button class="ri-tab" onclick="riTab('${card.prefix}','nohike')">🎟 More to Do</button>
    </div>
    <div id="${card.prefix}-eat" class="ri-panel active">${eatItems}</div>
    <div id="${card.prefix}-nohike" class="ri-panel">${nohikeItems}</div>
  </div>`;
}

function renderRegion(region) {
  const wxChip = region.weather
    ? `<span class="wx-chip" id="wxchip-${region.id}">🌡️ …</span>`
    : '';
  const header = `<div id="${region.id}" class="region-header" style="border-color:${region.color}">
    <span style="font-size:24px">${region.emoji}</span>
    <h2 style="color:${region.color}">${region.title}</h2>
    <span class="dates">${region.dates}</span>
    ${wxChip}
  </div>`;
  const infoCard = region.infoCard ? renderInfoCard(region.infoCard) : '';
  const days     = region.days.map(id => renderDay(id, DAYS[id])).join('');
  return header + infoCard + days;
}

function renderItinerary() {
  document.getElementById('itinerary').innerHTML = REGIONS.map(renderRegion).join('');
}

// ── CALENDAR ───────────────────────────────────────────────
const MONTH_FULL = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

// Build { isoDate -> dayId } and { dayId -> region } lookups from the data.
function buildDayIndex() {
  const dateToDay = {}, dayToRegion = {};
  REGIONS.forEach(r => r.days.forEach(id => { dayToRegion[id] = r; }));
  Object.keys(DAYS).forEach(id => { dateToDay[DAYS[id].date] = id; });
  return { dateToDay, dayToRegion };
}

function renderMonthGrid(year, month, idx, start, end) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const lead = new Date(year, month, 1).getDay();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="cal-cell cal-empty"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const iso = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const cur = new Date(year, month, d);
    const dayId = idx.dateToDay[iso];
    if (dayId) {
      const region = idx.dayToRegion[dayId];
      const day = DAYS[dayId];
      // day.calColor (optional) overrides the region colour for this one cell,
      // so a day that needs extra attention can be flagged in the calendar.
      const color = day.calColor || (region ? region.color : 'var(--border)');
      const booked = day.booked || [];
      // Tooltip carries the day title plus anything that must be booked ahead.
      const tipLines = [day.title].concat(
        day.calNote ? ['⚠ ' + day.calNote] : [],
        booked.map(b => '🎟 ' + b.label)
      );
      const title = tipLines.join(' · ').replace(/"/g, '&quot;');
      const tix = booked.length ? '<span class="cal-tix">🎟</span>' : '';
      cells += `<div class="cal-cell cal-trip" style="border-color:${color}"
          onclick="goToDay('${dayId}')" title="${title}">
        <div class="cal-top"><span class="cal-num">${d}</span>${tix}</div>
        <span class="cal-dot" style="background:${color}"></span>
      </div>`;
    } else {
      const inRange = cur >= start && cur <= end;
      cells += `<div class="cal-cell${inRange ? ' cal-inrange' : ''}">
        <span class="cal-num">${d}</span>
      </div>`;
    }
  }
  const dow = WEEKDAY_ABBR.map(w => `<div class="cal-dow">${w}</div>`).join('');
  return `<div class="cal-month">
    <div class="cal-month-name">${MONTH_FULL[month]} ${year}</div>
    <div class="cal-grid">${dow}${cells}</div>
  </div>`;
}

// Days carrying a `booked` list, printed under the grids so the
// advance-booking picture is readable without hovering a cell.
function renderBookingBoard() {
  const rows = Object.keys(DAYS)
    .filter(id => (DAYS[id].booked || []).length)
    .sort((a, b) => DAYS[a].date.localeCompare(DAYS[b].date))
    .map(id => {
      const day = DAYS[id];
      const items = day.booked.map(b =>
        `<div${b.must ? ' class="cal-book-must"' : ''}>🎟 ${b.label}</div>`
      ).join('');
      return `<div class="cal-book-row" onclick="goToDay('${id}')">
        <div class="cal-book-date">${formatDateFull(day.date)}</div>
        <div class="cal-book-items">${items}</div>
      </div>`;
    }).join('');
  if (!rows) return '';
  return `<div class="cal-book">
    <h3>🎟 Days that need advance booking</h3>
    <div class="cal-book-intro">Everything on this list has to be reserved or bought
      before the day itself. <span class="cal-book-must">Red</span> means the visit is
      impossible without a booking made in advance — do those first. Tap a row to open the day.</div>
    ${rows}
  </div>`;
}

function renderCalendar() {
  const idx = buildDayIndex();
  const start = parseISO(TRIP.start), end = parseISO(TRIP.end);
  let html = '', y = start.getFullYear(), m = start.getMonth();
  const endStamp = end.getFullYear() * 12 + end.getMonth();
  while (y * 12 + m <= endStamp) {
    html += renderMonthGrid(y, m, idx, start, end);
    if (++m > 11) { m = 0; y++; }
  }
  document.getElementById('calendar').innerHTML = `
    <div class="region-header" style="border-color:var(--border); padding-top:8px">
      <span style="font-size:24px">📅</span>
      <h2>Trip Calendar</h2>
      <span class="dates">${formatDate(TRIP.start)} – ${formatDate(TRIP.end)}</span>
    </div>
    <div class="cal-legend">Tap a highlighted day to jump to its plan below.
      🎟 marks a day with something that must be booked in advance — the full list is
      under the grid. A cell outlined in a colour other than its region's is flagged
      for extra attention.</div>
    ${html}
    ${renderBookingBoard()}`;
}

// Open a day card and scroll it into view (used by calendar cells).
function goToDay(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('open');
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── TASK STATE (localStorage) ──────────────────────────────
// Done-state and booking references survive a page reload by living
// in localStorage, keyed by each item's stable `key` from the trip
// data. The store is namespaced per trip (meta.id) so several trips
// on the same domain keep separate checklist state.
let TASK_STORE_KEY = null;
let TASK_STATE = {};
function loadTaskState() {
  try {
    const saved = localStorage.getItem(TASK_STORE_KEY);
    if (saved) return JSON.parse(saved) || {};
    // One-time migration from a pre-multi-trip storage key.
    if (META.legacyTaskKey) {
      const legacy = localStorage.getItem(META.legacyTaskKey);
      if (legacy) return JSON.parse(legacy) || {};
    }
    return {};
  }
  catch (e) { console.warn('Could not read saved tasks:', e); return {}; }
}
function saveTaskState() {
  try { localStorage.setItem(TASK_STORE_KEY, JSON.stringify(TASK_STATE)); }
  catch (e) { console.warn('Could not save tasks:', e); }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// Accept a pasted link with or without scheme; reject anything that
// isn't a plain http(s) address so a stored ref can't inject script.
function normalizeUrl(u) {
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w-]+(\.[\w-]+)+/.test(u)) return 'https://' + u;
  return '';
}
// Turn an HTML-context label back into plain text for the export file.
function decodeEntities(s) {
  return String(s).replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&#39;/g, "'").replace(/&quot;/g, '"');
}

const TYPE_BTN = {
  booking: ['📅 Book', 'res-btn-booking'],
  info:    ['ℹ Info',  'res-btn-info'],
  todo:    ['↗ Guide', 'res-btn-guide'],
};

function getResBtn(item) {
  if (!item.url) return '';
  const [label, cls] = TYPE_BTN[item.type] || ['↗ Open', 'res-btn-info'];
  return `<a class="res-btn ${cls}" href="${item.url}" target="_blank" rel="noopener">${label}</a>`;
}

function taskKey(section, item, i) { return item.key || `${section.id}-${i}`; }
function isTaskDone(item, key) {
  const st = TASK_STATE[key];
  if (st && typeof st.done === 'boolean') return st.done;
  return item.status === 'done';
}

// 'open' (default) hides finished tasks so the list stays short.
let RES_FILTER = 'open';
function setResFilter(f) { RES_FILTER = f; renderResources(); }

function renderResItem(item, key, done) {
  const saved    = TASK_STATE[key] || {};
  const priClass = `pri-${item.priority || 'optional'}`;
  const subParts = [item.dates, item.notes];
  if (item.reservation_deadline) subParts.push(`⚠️ Book by ${item.reservation_deadline}`);
  const sub = subParts.filter(Boolean).join(' · ');

  const refNote = saved.refNote || item.refNote || '';
  const refUrl  = saved.refUrl  || item.refUrl  || '';
  const hasRef  = !!(refNote || refUrl);
  const refLink = normalizeUrl(refUrl);
  const refView = hasRef
    ? `<div class="res-ref">📎 ${refNote ? escapeHtml(refNote) : ''}` +
      `${refLink ? ` <a href="${escapeHtml(refLink)}" target="_blank" rel="noopener">open ↗</a>` : ''}</div>`
    : '';

  return `<div class="res-item${done ? ' task-label-done' : ''}">
    <div class="res-item-left">
      <button class="task-check${done ? ' done' : ''}" title="Mark ${done ? 'not done' : 'done'}"
        onclick="toggleDone('${key}', ${done ? 'false' : 'true'})">✓</button>
      <div class="pri-dot ${priClass}"></div>
      <div>
        <div class="res-item-label">${item.label}</div>
        ${sub ? `<div class="res-item-sub">${sub}</div>` : ''}
        ${refView}
      </div>
    </div>
    <div class="res-item-right">
      ${getResBtn(item)}
      <button class="res-ref-btn${hasRef ? ' has-ref' : ''}" title="Booking reference / confirmation"
        onclick="toggleRef('${key}')">📎</button>
    </div>
    <div class="res-ref-editor" id="refedit-${key}" hidden>
      <input class="res-ref-input" id="refnote-${key}" placeholder="Confirmation # / notes"
        value="${escapeHtml(refNote)}">
      <input class="res-ref-input" id="refurl-${key}" placeholder="Link to ticket / reservation"
        value="${escapeHtml(refUrl)}">
      <div class="res-ref-actions">
        <button class="res-ref-save" onclick="saveRef('${key}')">Save</button>
        <button class="res-ref-clear" onclick="clearRef('${key}')">Clear</button>
      </div>
    </div>
  </div>`;
}

function renderResSection(section) {
  const states = section.items.map((item, i) => {
    const key = taskKey(section, item, i);
    return { item, key, done: isTaskDone(item, key) };
  });
  const doneCount = states.filter(s => s.done).length;
  const visible = states.filter(s =>
    RES_FILTER === 'all' || (RES_FILTER === 'open' ? !s.done : s.done));
  if (!visible.length) return '';
  const intro = section.intro ? `<div class="res-intro">${section.intro}</div>` : '';
  const items = visible.map(s => renderResItem(s.item, s.key, s.done)).join('');
  return `<div class="res-section">
    <div class="res-section-header">
      <span style="font-size:20px">${section.icon}</span>
      <h3>${section.title}</h3>
      <span class="res-count">${doneCount}/${section.items.length} done</span>
    </div>
    ${intro}
    ${items}
  </div>`;
}

function renderResources() {
  let total = 0, doneTotal = 0;
  RESOURCES.sections.forEach(sec => sec.items.forEach((item, i) => {
    total++;
    if (isTaskDone(item, taskKey(sec, item, i))) doneTotal++;
  }));
  const pct = total ? Math.round(doneTotal / total * 100) : 0;
  const filters = [['open', 'To do'], ['done', 'Done'], ['all', 'All']].map(([f, label]) =>
    `<button class="res-filter${RES_FILTER === f ? ' active' : ''}" onclick="setResFilter('${f}')">${label}</button>`
  ).join('');
  const quickLinks = (QUICK_LINKS && QUICK_LINKS.length)
    ? `<div class="quick-links">${META.quickLinksLabel || '🔗 Links:'} ` + QUICK_LINKS.map(l =>
        `<a href="${l.url}" target="_blank" rel="noopener">${l.label} ↗</a>`).join(' · ') + `</div>`
    : '';
  const sections = RESOURCES.sections.map(renderResSection).join('');
  const empty = sections
    ? ''
    : `<div class="res-empty">${RES_FILTER === 'open' ? 'All tasks done 🎉' : 'Nothing here yet'}</div>`;
  document.getElementById('logistics').innerHTML = `
    <div class="region-header" style="border-color:var(--border); padding-top:8px">
      <span style="font-size:24px">✅</span>
      <h2>Trip Checklist</h2>
      <button class="res-export" onclick="exportTasks()">⬇ Export tasks</button>
    </div>
    ${quickLinks}
    <div class="res-progress">
      <div class="res-progress-label"><span>${doneTotal} of ${total} done</span><span>${pct}%</span></div>
      <div class="res-progress-bar"><div class="res-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="res-filters">${filters}</div>
    ${sections}${empty}`;
}

// Run a render step in isolation — a failure in one section must never
// blank out the rest of the page (map, itinerary, ops center, …).
function safeRender(name, fn) {
  try { fn(); }
  catch (err) { console.error('Render step "' + name + '" failed:', err); }
}

// ══════════════════════════════════════
// LIVE WEATHER  (Open-Meteo — no API key, CORS-enabled, free for non-commercial use)
// Used here only for the small "now" chip in each region header.
// ══════════════════════════════════════
const WX_CODES = {
  0:['☀️','Clear'], 1:['🌤️','Mostly clear'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Fog'], 48:['🌫️','Freezing fog'],
  51:['🌦️','Light drizzle'], 53:['🌦️','Drizzle'], 55:['🌧️','Heavy drizzle'],
  56:['🌧️','Freezing drizzle'], 57:['🌧️','Freezing drizzle'],
  61:['🌦️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
  66:['🌧️','Freezing rain'], 67:['🌧️','Freezing rain'],
  71:['🌨️','Light snow'], 73:['🌨️','Snow'], 75:['❄️','Heavy snow'], 77:['🌨️','Snow grains'],
  80:['🌦️','Rain showers'], 81:['🌧️','Rain showers'], 82:['⛈️','Heavy rain showers'],
  85:['🌨️','Snow showers'], 86:['❄️','Heavy snow showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Thunderstorm w/ hail'], 99:['⛈️','Severe thunderstorm']
};
function wxInfo(code) { return WX_CODES[code] || ['🌡️','—']; }
function wxApiUrl(loc) {
  return 'https://api.open-meteo.com/v1/forecast?latitude=' + loc.lat + '&longitude=' + loc.lon
    + '&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto';
}
// Fill a region-header chip with current conditions. On any failure the chip
// just disappears — it must never throw into the synchronous render path.
async function loadWeatherChip(el, loc) {
  try {
    const r = await fetch(wxApiUrl(loc));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const [emoji] = wxInfo(j.current.weather_code);
    el.textContent = emoji + ' ' + Math.round(j.current.temperature_2m) + '°F now';
    el.title = 'Live conditions in ' + loc.name;
  } catch (err) {
    console.warn('Weather chip failed for ' + loc.name + ':', err);
    el.textContent = '';
  }
}

// ── CHROME (nav / legend / footer — generated from trip data) ──
function renderNav() {
  const regionLinks = REGIONS.map(r =>
    `<a href="#${r.id}" style="border-bottom:2px solid ${r.color}">${r.navLabel || r.title}</a>`
  ).join('');
  document.querySelector('nav').innerHTML =
    `<a href="#map-section">🗺 Map</a>
     <a href="#calendar">📅 Calendar</a>
     ${regionLinks}
     <a href="#logistics">✅ Checklist</a>`;
}

function renderLegend() {
  const regionRows = REGIONS.map(r =>
    `<div class="leg-row"><div class="leg-dot" style="background:${r.color}"></div> ${r.navLabel || r.title}</div>`
  ).join('');
  const hasTier2 = POIS.some(p => p.tier === 2);
  const hasTier3 = POIS.some(p => p.tier === 3);
  const poiRows =
    (hasTier2 ? `<div class="leg-row"><div class="leg-dot" style="background:#475569"></div> Activities <span style="color:var(--muted)">(zoom in)</span></div>` : '') +
    (hasTier3 ? `<div class="leg-row"><div class="leg-dot" style="background:#b45309"></div> Food <span style="color:var(--muted)">(zoom in more)</span></div>` : '');
  document.querySelector('.map-legend').innerHTML = `<h4>Legend</h4>${regionRows}${poiRows}`;
}

function renderFooter() {
  document.querySelector('footer').textContent = META.footer || META.title;
}

// ── DASHBOARD BOOT (called once the trip data file has loaded) ──
function initDashboard(data) {
  META        = data.meta;
  TRIP        = { start: META.start, end: META.end };
  ROUTE       = data.route      || [];
  ROUTES_ALT  = data.routesAlt  || [];
  STOPS       = data.stops      || [];
  POIS        = data.pois       || [];
  REGIONS     = data.regions    || [];
  DAYS        = data.days       || {};
  QUICK_LINKS = data.quickLinks || [];
  RESOURCES   = data.resources  || { sections: [] };

  document.title = META.title;
  TASK_STORE_KEY = 'trip-tasks-' + META.id;
  TASK_STATE = loadTaskState();

  // In case the picker was shown before this trip finished loading
  document.getElementById('trip-picker').hidden = true;
  document.querySelector('.page').style.display = '';
  document.querySelector('nav').style.display = '';

  safeRender('nav',       renderNav);
  safeRender('legend',    renderLegend);
  safeRender('footer',    renderFooter);
  safeRender('calendar',  renderCalendar);
  safeRender('itinerary', renderItinerary);
  safeRender('resources', renderResources);
  safeRender('map',       initMap);

  // Kick off the live "now" weather chips (async, fire-and-forget)
  safeRender('weather-chips', function () {
    REGIONS.forEach(function (r) {
      if (!r.weather) return;
      const chip = document.getElementById('wxchip-' + r.id);
      if (chip) loadWeatherChip(chip, r.weather);
    });
  });
}

// ══════════════════════════════════════
// NON-MAP UTILS (work without Leaflet)
// ══════════════════════════════════════
function toggle(id) {
  document.getElementById(id).classList.toggle('open');
}

function hikeTab(prefix, tab) {
  const target = document.getElementById(`${prefix}-${tab}`);
  if (!target) return;
  const card = target.closest('.hike-tabs');
  card.querySelectorAll('.hike-option').forEach(el => el.classList.remove('active'));
  target.classList.add('active');
  card.querySelectorAll('.htab').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${tab}'`));
  });
}

function toggleDone(key, done) {
  const st = TASK_STATE[key] || {};
  st.done = done;
  TASK_STATE[key] = st;
  saveTaskState();
  renderResources();
}

// Show/hide the inline reference editor for a task.
function toggleRef(key) {
  const ed = document.getElementById('refedit-' + key);
  if (ed) ed.hidden = !ed.hidden;
}

// Persist a booking reference (confirmation text + link) for a task.
function saveRef(key) {
  const note = (document.getElementById('refnote-' + key).value || '').trim();
  const url  = (document.getElementById('refurl-'  + key).value || '').trim();
  const st = TASK_STATE[key] || {};
  if (note) st.refNote = note; else delete st.refNote;
  if (url)  st.refUrl  = url;  else delete st.refUrl;
  if (!st.refNote && !st.refUrl && typeof st.done !== 'boolean') delete TASK_STATE[key];
  else TASK_STATE[key] = st;
  saveTaskState();
  renderResources();
}

function clearRef(key) {
  const st = TASK_STATE[key];
  if (st) {
    delete st.refNote; delete st.refUrl;
    if (typeof st.done !== 'boolean') delete TASK_STATE[key];
  }
  saveTaskState();
  renderResources();
}

// Download every task with its current status and reference as JSON —
// a portable backup / shareable snapshot of trip progress.
function exportTasks() {
  const tasks = [];
  RESOURCES.sections.forEach(sec => {
    sec.items.forEach((item, i) => {
      const key = taskKey(sec, item, i);
      const st = TASK_STATE[key] || {};
      tasks.push({
        section: decodeEntities(sec.title),
        task: decodeEntities(item.label),
        status: isTaskDone(item, key) ? 'done' : 'pending',
        reference: st.refNote || item.refNote || '',
        link: st.refUrl || item.refUrl || ''
      });
    });
  });
  const payload = { trip: document.title, exported: new Date().toISOString(), tasks };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'trip-tasks-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
}

function riTab(region, tab) {
  ['eat','nohike'].forEach(t => {
    const el = document.getElementById(`${region}-${t}`);
    if (el) el.classList.remove('active');
  });
  const target = document.getElementById(`${region}-${tab}`);
  if (!target) return;
  target.classList.add('active');
  target.closest('.region-info-card').querySelectorAll('.ri-tab').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${tab}'`));
  });
}

// ══════════════════════════════════════
// MAP — called from initDashboard. Leaflet loads synchronously in
// <head>, so by the time the trip data arrives it is either present
// or its CDN failed (handled below).
// ══════════════════════════════════════
function initMap() {

  if (typeof L === 'undefined') {
    // Leaflet CDN failed — show a friendly fallback inside the map div
    const mapEl = document.getElementById('map');
    mapEl.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
                  height:100%;gap:12px;color:#94a3b8;font-family:-apple-system,sans-serif;padding:24px;text-align:center">
        <div style="font-size:48px">🗺️</div>
        <div style="font-size:16px;font-weight:700;color:#e2e8f0">Map needs an internet connection</div>
        <div style="font-size:13px;max-width:280px">Connect to Wi-Fi or mobile data, then reload the page to see the interactive map.</div>
      </div>`;
    return;
  }

  // ── TILE LAYER ──
  const map = L.map('map', {
    zoomControl: true,
    tap: true,          // enable tap handler on iOS
    tapTolerance: 15    // more forgiving touch on phones
  });

  // Auto-fit the view to this trip's geography (route + alt routes + stops + POIs).
  const points = ROUTE
    .concat(ROUTES_ALT.flatMap(r => r.points))
    .concat(STOPS.map(s => [s.lat, s.lng]))
    .concat(POIS.map(p => [p.lat, p.lng]));
  if (points.length) map.fitBounds(L.latLngBounds(points), { padding: [30, 30] });
  else map.setView([39, -98], 4);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
    crossOrigin: true
  }).addTo(map);

  // Force a size recalculation in case the container dimensions weren't final at init time
  setTimeout(() => map.invalidateSize(), 200);

  // ── ROUTE & MARKERS (from the trip data) ──
  L.polyline(ROUTE, { color:'#1E40AF', weight:4, opacity:0.85, smoothFactor:1 }).addTo(map);

  // Alternate / flex routes — dashed so they read as "optional branch".
  ROUTES_ALT.forEach(r => {
    const line = L.polyline(r.points, { color: r.color || '#0EA5E9', weight: 3, opacity: 0.8, dashArray: '6 8', smoothFactor: 1 }).addTo(map);
    if (r.label) line.bindPopup(`<div style="font-family:-apple-system,sans-serif;font-size:13px;font-weight:600;color:#1e293b">${r.label}</div>`);
  });

  // Every popup gets a one-tap handoff into the native Google Maps app.
  function gmapsSearchBtn(query) {
    const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
    return `<a class="popup-gmaps" href="${url}" target="_blank" rel="noopener">🧭 Google Maps</a>`;
  }

  // Main trip stops — always visible, give the zoomed-out overview.
  STOPS.forEach(s => {
    const region = REGIONS.find(r => r.id === s.regionId);
    const color = s.color || (region && region.color) || '#475569';
    const icon = L.divIcon({
      html: `<div class="marker-main" style="background:${color}">${s.label}</div>`,
      className: '', iconSize: [34,34], iconAnchor: [17,17], popupAnchor: [0,-20]
    });
    L.marker([s.lat, s.lng], { icon })
      .addTo(map)
      .bindPopup(`
        <div style="font-family:-apple-system,sans-serif;min-width:160px">
          <div style="font-weight:700;font-size:14px;color:#1e293b;margin-bottom:4px">${s.title}</div>
          <div style="font-size:12px;color:#64748b">${s.dates}</div>
          ${gmapsSearchBtn(s.title)}
          ${s.regionId ? `<a class="popup-site" href="#${s.regionId}" onclick="document.getElementById('${s.regionId}').scrollIntoView({behavior:'smooth'});return false;">Plan ↓</a>` : ''}
        </div>`);
  });

  // POIs — tiered by zoom so detail never hides the overview:
  // tier 2 (activities, hikes, optional stops) from zoom 9,
  // tier 3 (restaurants, in-town spots) from zoom 11.
  function poiMarker(p) {
    const size = p.tier === 2 ? 26 : 22;
    const icon = L.divIcon({
      html: `<div class="marker-poi ${p.cat}" style="width:${size}px;height:${size}px;font-size:${size - 13}px">${p.icon}</div>`,
      className: '', iconSize: [size,size], iconAnchor: [size/2,size/2], popupAnchor: [0,-size/2-3]
    });
    return L.marker([p.lat, p.lng], { icon }).bindPopup(`
      <div style="font-family:-apple-system,sans-serif;min-width:170px;max-width:230px">
        <div style="font-weight:700;font-size:14px;color:#1e293b;margin-bottom:2px">${p.icon} ${p.name}</div>
        <div style="font-size:11px;color:#94a3b8;margin-bottom:4px">${p.area}</div>
        ${p.sub ? `<div style="font-size:12px;color:#475569;line-height:1.4">${p.sub}</div>` : ''}
        ${gmapsSearchBtn(p.gq || (p.name + ', ' + p.area))}
        ${p.url ? `<a class="popup-site" href="${p.url}" target="_blank" rel="noopener">Website ↗</a>` : ''}
      </div>`);
  }
  const tier2Layer = L.layerGroup(POIS.filter(p => p.tier === 2).map(poiMarker));
  const tier3Layer = L.layerGroup(POIS.filter(p => p.tier === 3).map(poiMarker));
  function updatePoiLayers() {
    const z = map.getZoom();
    if (z >= 9)  map.addLayer(tier2Layer); else map.removeLayer(tier2Layer);
    if (z >= 11) map.addLayer(tier3Layer); else map.removeLayer(tier3Layer);
  }
  map.on('zoomend', updatePoiLayers);
  updatePoiLayers();

  // ── NAV ACTIVE STATE ──
  const sections = ['map-section','calendar'].concat(REGIONS.map(r => r.id), ['logistics']);
  const navLinks = document.querySelectorAll('nav a');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        navLinks.forEach(a => a.classList.remove('active'));
        const link = document.querySelector(`nav a[href="#${e.target.id}"]`);
        if (link) link.classList.add('active');
      }
    });
  }, { threshold: 0.3 });
  sections.forEach(id => {
    const el = document.getElementById(id);
    if (el) observer.observe(el);
  });

} // end initMap

// ══════════════════════════════════════
// BOOTSTRAP — pick a trip from the manifest, load its data file,
// then render. URL form: index.html?trip=<id>. With a single trip
// in the manifest it loads directly; with several and no ?trip
// param, a picker landing page is shown instead.
// ══════════════════════════════════════
function showTripPicker(trips, message) {
  document.querySelector('.page').style.display = 'none';
  document.querySelector('nav').style.display = 'none';
  const picker = document.getElementById('trip-picker');
  const cards = trips.map(t => `
    <a class="trip-card" href="?trip=${encodeURIComponent(t.id)}">
      <div class="trip-title">${t.title}</div>
      <div class="trip-dates">${t.dates || ''}</div>
    </a>`).join('');
  picker.innerHTML = `
    <h1>🧳 Trip Dashboards</h1>
    <div class="picker-sub">${message || 'Pick a trip to open its map, itinerary and checklist.'}</div>
    ${cards || '<div class="picker-sub">No trips in trips/manifest.js yet — see the README to add one.</div>'}`;
  picker.hidden = false;
}

(function bootstrap() {
  const trips = (typeof TRIPS_MANIFEST !== 'undefined' && TRIPS_MANIFEST) || [];
  const requested = new URLSearchParams(location.search).get('trip');
  const entry = requested
    ? trips.find(t => t.id === requested)
    : (trips.length === 1 ? trips[0] : null);

  if (!entry) {
    const msg = requested ? `No trip called “${requested}” — pick one below.` : '';
    showTripPicker(trips, msg);
    return;
  }

  const s = document.createElement('script');
  s.src = entry.file + (entry.v ? '?v=' + entry.v : '');
  s.onload = function () {
    if (window.TRIP_DATA) initDashboard(window.TRIP_DATA);
    else showTripPicker(trips, `“${entry.title}” didn't define window.TRIP_DATA — check ${entry.file}.`);
  };
  s.onerror = function () {
    showTripPicker(trips, `Couldn't load ${entry.file} — check trips/manifest.js.`);
  };
  document.head.appendChild(s);
})();
</script>
